#练习pod 的滚动更新策略

apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-rollout
  namespace: dev2025
spec:
  strategy: #策略
    type: RollingUpdate #滚动更新策略
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  replicas: 3
  selector:
    matchLabels:
      app: nginx-pod
  template:
    metadata:
      labels:
        app: nginx-pod
    spec:
      containers:
      - name: nginx
        image: nginx:1.17.1




#应用该deployment 文件：
kubectl apply -f pod-rollout.yaml

#查看并监控pod 的运行情况：
kubectl get pods -n dev2025 -w

#更新NGINX的镜像版本，如从1.17.1 更新到1.17.2
kubectl set deploy pod-rollout image nginx=nginx:1.17.3 -n dev2025


