# 有用的命令，record 记录
kubectl create -f pod-rollout.yaml --record

# 查看pod,rs,deploy 的详细信息
kubectl get deploy,rs,pod -n dev2025


#查看版本回退状态
kubectl rollout status deploy pod-nginx -n dev2025

#版本更新加暂停
kubectl set image deploy pod-nginx nginx=1.17.4 -n dev2025 && kubectl rollout pause Deployment pod-nginx -n dev2025

#版本更新加暂停后的恢复更新

kubectl rollout resume Deployment pod-nginx -n dev2025
