apiVersion: v1
kind: Pod
metadata:
  name: pod-command
  namespace: dev2025
spec:
  containers:
  - name: nginx
    image: nginx:1.71.1
  - name: busybox
    image: busybox:1.30
    command: ["/bin/sh","-c","touch /tmp/hello.txt;while true;do /bin/echo $(date +%T) >> /tmp/hello.txt;sleep 3; done;"]


