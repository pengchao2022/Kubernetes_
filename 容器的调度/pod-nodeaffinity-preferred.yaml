# 软限制 

apiVersion: v1
kind: Pod
metadata:
  name: pod-nodeaffinity-preferred
  namespace: dev2025
spec:
  containers:
  - name: nginx
    image: nginx:1.17.1
  affinity: #亲和性设置
    nodeAffinity: #设置node 亲和性
      preferredDuringSchedulingIgnoredDuringExecution: #软限制
      - weight: 1
        preference:
          matchExpressions: #匹配env的值在["xxx","yyy"]中的标签
          - key: nodeenv
            operator: In
            values: ["xxx","yyy"]
