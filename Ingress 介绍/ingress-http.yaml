apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-http
  namesapce: dev2025
spec:
  rules:
  - host: nginx.bmw.com
    http:
      paths:
      - path: /
        backend:
          serviceName: nginx-service
          servicePort: 80
  - host: tomcat.bmw.com
    http:
      paths:
      - path: /
        backend:
          serviceName: tomcat-service
          servicePort: 8080

