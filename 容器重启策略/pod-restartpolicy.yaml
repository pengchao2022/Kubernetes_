# 容器重启策略练习

apiVersion: v1
kind: Pod
metadata:
  name: pod-restartpolicy
  namespace: dev2025
spec:
  containers:
  - name: nginx
    image: nginx:1.17.1
    ports:
    - name: nginx-port
      containerPort: 80
    livenessProbe:
      httpGet:
        scheme: HTTP
        port: 80
        path: /hello
  restartPolicy: Always #设置容器重启策略为always, 意味着只要失败就一直重启

