#使用TCPSocket 的方式来探测容器的健康状况

apiVersion: v1
kind: Pod
metadata:
  name: pod-liveness-tcpsocket
  namespace: dev2025
spec:
  containers:
  - name: nginx
    image: nginx:1.71.1
    ports:
    - name: nginx-port
      containerPort: 80
    livenessProbe:
      tcpSocket:
        port: 8080 #尝试访问8080端口

