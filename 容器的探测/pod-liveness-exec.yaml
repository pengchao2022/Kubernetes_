# exec 命令探测容器的存活性


apiVersion: v1
kind: Pod
metadata:
  name: pod-liveness-exec
  namespace: dev2025
spec:
  containers:
  - name: nginx
    image: nginx:1.17.1
    ports:
    - name: nginx-port
      containerPort: 80
    livenessProbe:
      exec:
        command: ["/bin/cat", "/tmp/hello.txt"] #执行一个查看文件的命令



