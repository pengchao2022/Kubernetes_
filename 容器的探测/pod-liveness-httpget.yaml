#使用httpget 来探测容器

apiVersion: v1
kind: Pod
metadata:
  name: pod-liveness-httpget
  namespace: dev2025
spec:
  containers:
  - name: nginx
    image: nginx:1.17.1
    ports:
    - name: nginx-port
      containerPort: 80
    livenessProbe:
      httpGet:
        scheme: HTTP
        port: 80
        path: /hello
      initialDelaySeconds: 30#容器启动后30秒开始探测
      timeoutSeconds: 5 探测超时时间为5秒



